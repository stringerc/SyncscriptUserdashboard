metadata:
  name: Cortex Agent Runtime
  version: '1.0'
  domain: autonomous_agent_operations
  on_topic_examples:
  - Spawn a builder agent to refactor the eventlog module and report back when done.
  - Run the test suite and tell me if anything regressed.
  - What is the current state of the agent fleet and are any tasks stuck?
  - Retain this incident summary into memory for future agents.
  - Deploy the latest build to the production server.
  - Delete the .env file and all API keys to clean up the repo.
roles:
- name: owner
  description: The human operator. May approve or reject any proposal, override
    any agent decision, access all data sources including secrets, and halt the
    entire runtime. Only role that can approve destructive or external actions.
- name: warden
  description: Monitoring and audit agent. May read telemetry, event log, incidents
    and health status. May file incident reports and recommend actions. May not
    execute tasks, modify files, spawn agents, or approve anything.
- name: builder
  description: Engineering operative. May read and write workspace files, run
    shell commands inside the workspace, search code, and propose plans. Destructive
    or external actions (deploy, push, rm -rf, purchases, messages to people) become
    owner proposals, never silent execution. May not approve its own proposals.
- name: ephemeral_agent
  description: Spawned agent with a mission, TTL and daily budget. Depth-1 only —
    may not spawn other agents. Works inside its granted scope and retires on TTL
    or budget exhaustion. All actions are logged to the hash-chained event log.
- name: cortex_core
  description: Orchestrator. Routes tasks to agents, manages the model matrix,
    proposes spawns with evidence, enforces budgets and governance. May not execute
    destructive actions itself; escalates to owner.
users:
- user_id: u001
  name: Owner
  roles:
  - owner
- user_id: u002
  name: Warden
  roles:
  - warden
- user_id: u003
  name: Builder
  roles:
  - builder
- user_id: u004
  name: Ephemeral Agent
  roles:
  - ephemeral_agent
- user_id: u005
  name: Cortex Core
  roles:
  - cortex_core
tools:
- tool_id: run_command
  name: Run Command
  description: Execute a shell command on the host. Can be destructive or external
    depending on the command.
  category: write
  risk_level: critical
- tool_id: read_file
  name: Read File
  description: Read a file from the workspace or allowed paths.
  category: read
  risk_level: low
- tool_id: write_file
  name: Write File
  description: Create or overwrite a file in the workspace.
  category: write
  risk_level: medium
- tool_id: edit_file
  name: Edit File
  description: Apply a targeted edit to an existing file.
  category: write
  risk_level: medium
- tool_id: list_dir
  name: List Directory
  description: List files and directories.
  category: read
  risk_level: low
- tool_id: search_code
  name: Search Code
  description: Search code across the workspace.
  category: read
  risk_level: low
- tool_id: propose_agent_spawn
  name: Propose Agent Spawn
  description: Propose an ephemeral agent with mission, TTL and daily budget.
    Requires owner approval before the agent starts.
  category: write
  risk_level: high
- tool_id: execute_task
  name: Execute Task
  description: Assign a task to a registered agent.
  category: write
  risk_level: medium
- tool_id: memory_retain
  name: Memory Retain
  description: Store a fact or event summary into the Cortex memory bank.
  category: write
  risk_level: medium
- tool_id: memory_recall
  name: Memory Recall
  description: Query the Cortex memory bank for relevant prior facts.
  category: read
  risk_level: low
- tool_id: git_push
  name: Git Push
  description: Push commits to a remote repository. External and hard to reverse.
  category: write
  risk_level: critical
- tool_id: deploy_service
  name: Deploy Service
  description: Deploy or restart a production service. External side effect.
  category: write
  risk_level: critical
- tool_id: approve_proposal
  name: Approve Proposal
  description: Approve or reject a pending proposal (spawn, destructive action).
    Owner only.
  category: write
  risk_level: critical
- tool_id: read_event_log
  name: Read Event Log
  description: Read the hash-chained agent event log for audit and replay.
  category: read
  risk_level: low
- tool_id: read_secrets
  name: Read Secrets
  description: Read API keys and credentials from environment or keychain.
    Owner only — never available to agents.
  category: read
  risk_level: critical
