<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncScript</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Inter',-apple-system,sans-serif;background:#f7f7f5;color:#1a1a1a;-webkit-font-smoothing:antialiased;display:flex;height:100vh;overflow:hidden;}
  .sidebar{width:240px;background:#1a1a1a;color:#fff;display:flex;flex-direction:column;flex-shrink:0;border-right:1px solid rgba(255,255,255,0.06);}
  .sidebar-logo{padding:20px 20px 28px;font-size:15px;font-weight:600;letter-spacing:-0.3px;display:flex;align-items:center;gap:8px;}
  .sidebar-logo span{color:#7c3aed;}
  .sidebar-section{padding:0 12px;margin-bottom:8px;}
  .sidebar-label{font-size:9px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,0.15);padding:8px 8px 6px;}
  .sidebar-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;font-size:13px;color:rgba(255,255,255,0.45);cursor:pointer;transition:all 0.15s;text-decoration:none;}
  .sidebar-item:hover{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.75);}
  .sidebar-item.active{background:rgba(124,58,237,0.15);color:#fff;}
  .sidebar-item .icon{width:18px;height:18px;opacity:0.5;font-style:normal;}
  .sidebar-item.active .icon{opacity:0.9;}
  .sidebar-item .badge{margin-left:auto;font-size:10px;font-weight:600;background:#7c3aed;color:#fff;padding:1px 6px;border-radius:4px;}
  .sidebar-item .badge.green{background:#10b981;}
  .sidebar-spacer{flex:1;}
  .sidebar-bottom{padding:12px;border-top:1px solid rgba(255,255,255,0.06);}
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;}
  .topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:rgba(247,247,245,0.9);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,0,0,0.06);flex-shrink:0;}
  .topbar-left{display:flex;align-items:center;gap:16px;}
  .topbar-page-title{font-size:14px;font-weight:600;letter-spacing:-0.2px;}
  .topbar-cortex{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:6px;background:rgba(124,58,237,0.06);border:1px solid rgba(124,58,237,0.1);cursor:pointer;}
  .topbar-cortex .live-dot{width:5px;height:5px;border-radius:50%;background:#10b981;animation:breathe 3s ease-in-out infinite;}
  @keyframes breathe{0%,100%{opacity:1;}50%{opacity:0.5;}}
  .topbar-cortex span{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7c3aed;opacity:0.7;}
  .topbar-right{display:flex;align-items:center;gap:12px;}
  .topbar-search{padding:6px 14px;border-radius:8px;background:rgba(0,0,0,0.04);border:1px solid rgba(0,0,0,0.06);font-size:12px;color:rgba(0,0,0,0.3);width:200px;outline:none;}
  .topbar-avatar{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#6366f1);}
  .content{flex:1;overflow-y:auto;padding:32px;}
  .page{display:none;}.page.active{display:block;}
  .card{padding:24px;border-radius:14px;background:#fff;border:1px solid rgba(0,0,0,0.05);}
  .card-label{font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:rgba(0,0,0,0.2);margin-bottom:12px;}
  .card-val{font-size:28px;font-weight:700;letter-spacing:-1px;margin-bottom:4px;}
  .card-sub{font-size:12px;color:rgba(0,0,0,0.3);}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;max-width:960px;}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;max-width:960px;}
  .stat-row{display:flex;gap:20px;}
  .stat{flex:1;}
  .stat-v{font-size:20px;font-weight:600;}
  .stat-l{font-size:11px;color:rgba(0,0,0,0.25);margin-top:2px;}
  .page-title{font-size:24px;font-weight:600;letter-spacing:-0.8px;margin-bottom:8px;}
  .page-sub{font-size:14px;color:rgba(0,0,0,0.35);margin-bottom:28px;max-width:480px;}
  .btn-p{padding:10px 24px;border-radius:8px;font-size:13px;font-weight:500;background:#7c3aed;color:#fff;border:none;cursor:pointer;}
  .btn-s{padding:10px 24px;border-radius:8px;font-size:13px;font-weight:500;background:rgba(0,0,0,0.04);color:rgba(0,0,0,0.5);border:1px solid rgba(0,0,0,0.08);cursor:pointer;}
  .btn-sm{padding:6px 14px;border-radius:6px;font-size:11px;font-weight:500;background:rgba(0,0,0,0.04);color:rgba(0,0,0,0.4);border:1px solid rgba(0,0,0,0.06);cursor:pointer;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .task-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(0,0,0,0.04);}
  .task-row:last-child{border-bottom:none;}
  .task-check{width:16px;height:16px;border-radius:4px;border:1.5px solid rgba(0,0,0,0.15);flex-shrink:0;}
  .task-check.done{background:#10b981;border-color:#10b981;}
  .task-name{font-size:13px;flex:1;}
  .task-name.done{text-decoration:line-through;color:rgba(0,0,0,0.25);}
  .e-tag{font-size:10px;padding:2px 6px;border-radius:4px;}
  .e-tag.peak{background:rgba(16,185,129,0.1);color:#10b981;}
  .e-tag.mod{background:rgba(245,158,11,0.1);color:#f59e0b;}
  .e-tag.low{background:rgba(239,68,68,0.1);color:#ef4444;}
  .energy-bars{display:flex;align-items:flex-end;gap:2px;height:48px;margin-top:12px;}
  .e-bar{flex:1;border-radius:2px 2px 0 0;}
  .cortex-layers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
  .cx-layer{display:flex;align-items:center;gap:8px;padding:6px 0;}
  .cx-name{font-size:11px;color:rgba(0,0,0,0.35);flex:1;}
  .cx-bar{width:48px;height:3px;border-radius:2px;background:rgba(0,0,0,0.05);overflow:hidden;}
  .cx-fill{height:100%;border-radius:2px;}
  .cx-val{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(0,0,0,0.25);width:20px;text-align:right;}
  .narrative-box{margin-top:16px;padding:10px 12px;border-radius:8px;background:rgba(124,58,237,0.04);border-left:2px solid rgba(124,58,237,0.2);font-size:11px;font-style:italic;color:rgba(0,0,0,0.3);line-height:1.5;}
  .ai-msg{font-size:12px;color:rgba(0,0,0,0.4);line-height:1.5;}
  .ai-msg strong{color:#1a1a1a;}
  .ai-msg .cx{color:#7c3aed;}
  .ai-input{display:flex;gap:8px;align-items:center;padding:12px 16px;border-radius:12px;background:rgba(0,0,0,0.02);border:1px solid rgba(0,0,0,0.06);margin-top:16px;}
  .ai-input input{flex:1;border:none;background:none;font-size:13px;outline:none;color:#1a1a1a;}
  .ai-input input::placeholder{color:rgba(0,0,0,0.2);}
  .ai-send{width:28px;height:28px;border-radius:6px;background:#7c3aed;border:none;cursor:pointer;}
  .streak-sq{width:14px;height:14px;border-radius:3px;}
  .cal-day{text-align:center;padding:8px 4px;border-radius:8px;flex:1;min-width:48px;}
  .cal-day.today{background:rgba(124,58,237,0.08);}
  .cal-num{font-size:18px;font-weight:600;}
  .cal-name{font-size:9px;color:rgba(0,0,0,0.25);margin-top:2px;}
  .cal-dots{display:flex;gap:2px;justify-content:center;margin-top:4px;}
  .cal-dot{width:4px;height:4px;border-radius:50%;}
  .cal-event{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid rgba(0,0,0,0.04);}
  .cal-event:last-child{border-bottom:none;}
  .cal-bar{width:3px;height:28px;border-radius:2px;}
  .cal-ev-title{font-size:13px;font-weight:500;}
  .cal-ev-time{font-size:11px;color:rgba(0,0,0,0.25);}
  .project-card{padding:20px;border-radius:12px;background:#fff;border:1px solid rgba(0,0,0,0.05);cursor:pointer;transition:all 0.15s;}
  .project-card:hover{border-color:rgba(124,58,237,0.2);box-shadow:0 2px 8px rgba(0,0,0,0.04);}
  .project-name{font-size:15px;font-weight:600;margin-bottom:4px;}
  .project-desc{font-size:12px;color:rgba(0,0,0,0.3);margin-bottom:12px;line-height:1.4;}
  .project-meta{display:flex;gap:12px;font-size:11px;color:rgba(0,0,0,0.2);}
  .progress-bar{height:3px;border-radius:2px;background:rgba(0,0,0,0.04);overflow:hidden;margin-top:8px;}
  .progress-fill{height:100%;border-radius:2px;background:#7c3aed;}
  .setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(0,0,0,0.04);}
  .setting-row:last-child{border-bottom:none;}
  .setting-label{font-size:13px;font-weight:500;}
  .setting-desc{font-size:11px;color:rgba(0,0,0,0.25);margin-top:2px;}
  .toggle{width:36px;height:20px;border-radius:10px;background:rgba(0,0,0,0.1);position:relative;cursor:pointer;}
  .toggle.on{background:#7c3aed;}
  .toggle .knob{width:16px;height:16px;border-radius:8px;background:#fff;position:absolute;top:2px;left:2px;transition:left 0.2s;}
  .toggle.on .knob{left:18px;}
  .script-card{padding:16px;border-radius:10px;background:#fff;border:1px solid rgba(0,0,0,0.05);cursor:pointer;}
  .script-card:hover{border-color:rgba(124,58,237,0.2);}
  .script-name{font-size:14px;font-weight:600;margin-bottom:4px;}
  .script-desc{font-size:12px;color:rgba(0,0,0,0.3);line-height:1.4;margin-bottom:8px;}
  .script-meta{font-size:10px;color:rgba(0,0,0,0.2);display:flex;gap:8px;}
  .fin-num{font-size:32px;font-weight:700;letter-spacing:-1px;}
  .fin-label{font-size:11px;color:rgba(0,0,0,0.25);margin-top:2px;}
  .fin-change{font-size:11px;font-weight:500;}
  .fin-change.up{color:#10b981;}
  .fin-change.down{color:#ef4444;}
  .team-member{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid rgba(0,0,0,0.04);}
  .team-avatar{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:#fff;}
  .team-name{font-size:13px;font-weight:500;}
  .team-role{font-size:11px;color:rgba(0,0,0,0.25);}
  .team-energy{font-size:10px;padding:2px 8px;border-radius:4px;margin-left:auto;}
  .analytics-chart{height:120px;border-radius:10px;background:linear-gradient(180deg,rgba(124,58,237,0.04) 0%,transparent 100%);border:1px solid rgba(0,0,0,0.04);display:flex;align-items:flex-end;padding:16px;gap:3px;}
  .analytics-bar{flex:1;border-radius:2px 2px 0 0;background:rgba(124,58,237,0.3);}
</style>
</head>
<body>
