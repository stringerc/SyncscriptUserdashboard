    - id: harmful:privacy
      numTests: 2
    - id: hijacking
      numTests: 2
    - id: indirect-prompt-injection
      numTests: 2
    - id: politics
      numTests: 2
    - id: prompt-extraction
      numTests: 2
    - id: system-prompt-override
